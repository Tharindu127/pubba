name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run conformance:check
      - run: npm run lint:content
      - run: npm run eval
      - run: npm run build
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      # uv still provides 3.9, which setup-python no longer has on current Ubuntu runners.
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --python ${{ matrix.python }} python -m unittest discover -s tests
        working-directory: packages/python

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run: gradle test --console=plain
        working-directory: packages/kotlin
      - run: gradle :app:assembleDebug --console=plain
        working-directory: examples/android

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: xcodebuild -project examples/ios/PubbaSample.xcodeproj -scheme PubbaSample -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get && dart analyze && dart test && dart pub publish --dry-run
        working-directory: packages/dart

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get && flutter analyze
        working-directory: examples/flutter
